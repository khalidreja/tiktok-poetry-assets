name: decode-b64-images
on:
  push:
    paths: ['posts/**/*.b64', 'prog-langs/**/*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 files to binary
        run: |
          set -e
          for dir in posts prog-langs; do
            [ -d "$dir" ] || continue
            for f in $(find "$dir" -name '*.b64'); do
              base64 -d "$f" > "${f%.b64}"
              git rm -q "$f"
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode images" && git push
