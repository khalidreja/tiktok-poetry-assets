name: decode-b64-images
on:
  push:
    paths: ['posts/**/*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 files to binary
        run: |
          set -e
          for f in $(find posts -name '*.b64'); do
            base64 -d "$f" > "${f%.b64}"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Decode images" && git push
